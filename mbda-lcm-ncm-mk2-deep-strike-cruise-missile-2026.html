const A={
  "en": {

    "title": "Europe's Tomahawk Answer: MBDA Unveils the LCM/NCM Mk2 Deep-Strike Cruise Missile",
    "subtitle": "Presented at Eurosatory 2026, the land- and sea-launched Mk2 delivers 1,000+ km precision strike with next-generation anti-jamming, IR terminal guidance and a four-cell mobile launcher ready by 2029 — filling a gap left by the collapse of Germany's Tomahawk procurement.",
    "body": "<p>At Eurosatory 2026 in Paris, MBDA pulled the curtain on what may become Europe's defining deep-strike weapon for the next decade: the Naval Cruise Missile – Land Cruise Missile Mk2 (NCM-LCM Mk2). For the first time, the company displayed a complete ground-launch system alongside the upgraded missile — a full-scale four-canister erector-launcher that can be operational from an unprepared position in under fifteen minutes.</p>\n\n<h3>Lineage and Logic</h3>\n<p>The Mk2 descends from the Missile de Croisière Naval (MdCN), which has equipped French Navy FREMM frigates and Suffren-class nuclear attack submarines since 2017. The MdCN earned its combat-proven status in April 2018 when the frigates <em>Aquitaine</em>, <em>Provence</em> and <em>Languedoc</em> launched three rounds at a Syrian chemical-weapons facility in a joint operation with the United States and the United Kingdom. The new variant retains the same 6.5-metre airframe — critical for compatibility with the Sylver A70 vertical launcher and 21-inch submarine torpedo tubes — while upgrading almost everything inside the skin.</p>\n\n<h3>What Changes in the Mk2</h3>\n<p>The most visible modification is a reshaped nose section optimised for greater range and housing a substantially upgraded sensor suite: an infrared seeker for terminal guidance, electro-optical systems for topographical navigation, and a hybrid GNSS/INS package that keeps the missile accurate when satellite signals are jammed, spoofed or denied. A new-generation anti-jamming device hardens the navigation chain further. MBDA claims improved stealth through a reduced radar cross-section and a terrain-following flight profile that allows the Mk2 to cruise at lower altitudes than its predecessor, making it harder to detect and engage by integrated air-defence systems.</p>\n\n<p>The combination of inertial, terrain-referenced, electro-optical and infrared guidance gives the missile multiple redundant paths to metric-class accuracy at terminal phase — a deliberate hedge against the electronic-warfare environments that have defined the war in Ukraine.</p>\n\n<h3>The Ground Launcher</h3>\n<p>The Land Cruise Missile variant pairs the Mk2 with a Ground Launch System (GLS) derived from the naval Sylver A70, housing four canisters. MBDA envisions mobile batteries capable of shoot-and-scoot operations from concealed positions, providing armies with a deep-strike arm independent of air power or the fleet. The concept mirrors the US Army's Typhon system, which adapts the Mk 41 VLS for land-based Tomahawk and SM-6 launches — except that the LCM is a sovereign European product with no US export-licence strings attached.</p>\n\n<p>The GLS is scheduled for availability from 2029, with full system entry into service targeted around 2030. France's Direction Générale de l'Armement (DGA) is in negotiations with MBDA for an initial production batch.</p>\n\n<h3>Filling the Tomahawk Gap</h3>\n<p>The geopolitical context gives the LCM Mk2 special urgency. Germany had been pursuing a Tomahawk procurement to equip its ground forces with long-range strike, but that deal has effectively collapsed. Denmark is similarly seeking a deep-strike solution, though potentially requiring range beyond the Mk2's current 1,000+ km envelope. The six-nation European Long-range Strike Approach (ELSA) — grouping France, Germany, Italy, Poland, Sweden and the United Kingdom — aims for a future weapon exceeding 2,000 km, but that programme is unlikely to deliver before the mid-2030s. The LCM Mk2 positions itself as the bridge: a sovereign, combat-proven-lineage option available years before ELSA matures.</p>\n\n<h3>The Wider Portfolio</h3>\n<p>At Eurosatory, MBDA paired the LCM Mk2 with DELUGE, a lower-cost ground-launched one-way effector with a 500 km range designed for saturation attacks. The layered approach — precision cruise missile for high-value targets, mass-effect munitions for area suppression — reflects a doctrine that accepts neither weapon alone is sufficient against a peer adversary's layered defences. Competing solutions in the European deep-strike market include the Soframe–Thales–ArianeGroup X-Fire launcher system and Safran-MBDA's Thundart rocket programme.</p>\n\n<p>With a proven combat record, a clear industrial base, and a ground-launch timeline that beats most alternatives to fielding, the NCM-LCM Mk2 is MBDA's strongest bid yet for becoming the standard European deep-strike cruise missile.</p>"
  },
  "el": {
    "lang_label": "EL",
    "cat": "Άμυνα",
    "date": "3 Ιουλίου 2026",
    "cities": "· Παρίσι · Λονδίνο · Βερολίνο",
    "title": "Η Ευρωπαϊκή Απάντηση στο Tomahawk: Η MBDA Αποκαλύπτει τον Βαλλιστικό Πύραυλο Κρουζ LCM/NCM Mk2",
    "subtitle": "Παρουσιάστηκε στη Eurosatory 2026 — ο χερσαίος και ναυτικός Mk2 προσφέρει πλήγμα ακριβείας 1.000+ χλμ. με anti-jamming νέας γενιάς, υπέρυθρη τερματική καθοδήγηση και τετραπλό κινητό εκτοξευτή έτοιμο ως το 2029, καλύπτοντας το κενό από την κατάρρευση της γερμανικής προμήθειας Tomahawk.",
    "body": "<p>Στη Eurosatory 2026 στο Παρίσι, η MBDA αποκάλυψε αυτό που μπορεί να γίνει το κυρίαρχο ευρωπαϊκό όπλο βαθέος πλήγματος για την επόμενη δεκαετία: τον Ναυτικό Πύραυλο Κρουζ – Χερσαίο Πύραυλο Κρουζ Mk2 (NCM-LCM Mk2). Για πρώτη φορά, η εταιρεία παρουσίασε πλήρες χερσαίο σύστημα εκτόξευσης δίπλα στο αναβαθμισμένο βλήμα — ένα τετραπλό canister erector-launcher σε πλήρη κλίμακα, επιχειρησιακά έτοιμο σε λιγότερο από δεκαπέντε λεπτά από μη προετοιμασμένη θέση.</p>\n\n<h3>Γενεαλογία και Λογική</h3>\n<p>Ο Mk2 προέρχεται από τον Missile de Croisière Naval (MdCN), που εξοπλίζει τις φρεγάτες FREMM και τα πυρηνοκίνητα υποβρύχια κλάσης Suffren του γαλλικού Πολεμικού Ναυτικού από το 2017. Ο MdCN απέκτησε το στάτους «δοκιμασμένο σε μάχη» τον Απρίλιο του 2018, όταν οι φρεγάτες <em>Aquitaine</em>, <em>Provence</em> και <em>Languedoc</em> εκτόξευσαν τρία βλήματα εναντίον συριακής εγκατάστασης χημικών όπλων σε κοινή επιχείρηση με τις ΗΠΑ και το Ηνωμένο Βασίλειο. Η νέα παραλλαγή διατηρεί το ίδιο αεροδυναμικό σώμα 6,5 μέτρων — κρίσιμο για τη συμβατότητα με τον κάθετο εκτοξευτή Sylver A70 και τους σωλήνες τορπιλών 21 ιντσών — αναβαθμίζοντας ωστόσο σχεδόν τα πάντα κάτω από τον φλοιό.</p>\n\n<h3>Τι Αλλάζει στον Mk2</h3>\n<p>Η πιο εμφανής τροποποίηση είναι η αναδιαμορφωμένη μύτη, βελτιστοποιημένη για μεγαλύτερη εμβέλεια και στεγάζοντας ουσιαστικά αναβαθμισμένο σύστημα αισθητήρων: υπέρυθρο αισθητήρα τερματικής καθοδήγησης, ηλεκτρο-οπτικά συστήματα τοπογραφικής πλοήγησης, και υβριδικό πακέτο GNSS/INS που διατηρεί τον πύραυλο ακριβή όταν τα δορυφορικά σήματα παρεμβάλλονται, πλαστογραφούνται ή αρνούνται. Μια συσκευή anti-jamming νέας γενιάς σκληραίνει περαιτέρω την αλυσίδα πλοήγησης. Η MBDA δηλώνει βελτιωμένο stealth μέσω μειωμένης ραντάρ διατομής και προφίλ πτήσης ακολούθησης εδάφους που επιτρέπει στον Mk2 να πετά χαμηλότερα από τον προκάτοχό του, καθιστώντας τον δυσκολότερο στην ανίχνευση και αντιμετώπιση από ολοκληρωμένα συστήματα αεράμυνας.</p>\n\n<p>Ο συνδυασμός αδρανειακής, τοπογραφικής, ηλεκτρο-οπτικής και υπέρυθρης καθοδήγησης δίνει στο βλήμα πολλαπλές εφεδρικές διαδρομές προς ακρίβεια μετρικής κλάσης στην τερματική φάση — σκόπιμη αντιστάθμιση ενάντια στα περιβάλλοντα ηλεκτρονικού πολέμου που χαρακτηρίζουν τον πόλεμο στην Ουκρανία.</p>\n\n<h3>Ο Χερσαίος Εκτοξευτής</h3>\n<p>Η χερσαία παραλλαγή LCM ζευγαρώνει τον Mk2 με ένα Ground Launch System (GLS) που βασίζεται στον ναυτικό Sylver A70 και φιλοξενεί τέσσερα canisters. Η MBDA σχεδιάζει κινητές πυροβολαρχίες ικανές για shoot-and-scoot από κρυμμένες θέσεις, παρέχοντας στους στρατούς βραχίονα βαθέος πλήγματος ανεξάρτητο από αεροπορική ή ναυτική ισχύ. Το concept αντικατοπτρίζει το αμερικανικό σύστημα Typhon — με τη διαφορά ότι ο LCM είναι κυρίαρχο ευρωπαϊκό προϊόν χωρίς αμερικανικές δεσμεύσεις εξαγωγών.</p>\n\n<p>Το GLS αναμένεται διαθέσιμο από το 2029, με πλήρη είσοδο σε υπηρεσία γύρω στο 2030. Η γαλλική DGA βρίσκεται σε διαπραγματεύσεις με την MBDA για αρχική παρτίδα παραγωγής.</p>\n\n<h3>Καλύπτοντας το Κενό του Tomahawk</h3>\n<p>Το γεωπολιτικό πλαίσιο δίνει ιδιαίτερη επείγουσα σημασία στον LCM Mk2. Η Γερμανία επιδίωκε προμήθεια Tomahawk για χερσαίο βαθύ πλήγμα, αλλά η συμφωνία αυτή κατέρρευσε ουσιαστικά. Η Δανία αναζητά ομοίως λύση βαθέος πλήγματος, αν και ενδεχομένως απαιτεί εμβέλεια πέραν του τρέχοντος φακέλου 1.000+ χλμ. του Mk2. Η εξαμελής πρωτοβουλία ELSA (European Long-range Strike Approach) — Γαλλία, Γερμανία, Ιταλία, Πολωνία, Σουηδία και Ηνωμένο Βασίλειο — στοχεύει σε μελλοντικό όπλο 2.000+ χλμ., αλλά δεν αναμένεται να υλοποιηθεί πριν τα μέσα της δεκαετίας του 2030. Ο LCM Mk2 τοποθετεί τον εαυτό του ως γέφυρα: μια κυρίαρχη επιλογή αποδεδειγμένης γενεαλογίας, διαθέσιμη χρόνια πριν ωριμάσει η ELSA.</p>\n\n<h3>Το Ευρύτερο Χαρτοφυλάκιο</h3>\n<p>Στη Eurosatory, η MBDA παρουσίασε τον LCM Mk2 μαζί με το DELUGE, ένα χαμηλότερου κόστους χερσαίο one-way effector εμβέλειας 500 χλμ. σχεδιασμένο για επιθέσεις κορεσμού. Η πολυεπίπεδη προσέγγιση — πύραυλος κρουζ ακριβείας για στόχους υψηλής αξίας, πυρομαχικά μαζικού αποτελέσματος για κατασταλτική κάλυψη — αντανακλά ένα δόγμα που αποδέχεται ότι κανένα μεμονωμένο όπλο δεν αρκεί ενάντια στις πολυεπίπεδες άμυνες ομότιμου αντιπάλου. Ανταγωνιστικές λύσεις στην ευρωπαϊκή αγορά βαθέος πλήγματος περιλαμβάνουν το σύστημα εκτοξευτή X-Fire (Soframe–Thales–ArianeGroup) και το πρόγραμμα πυραύλου Thundart (Safran-MBDA).</p>\n\n<p>Με αποδεδειγμένο μαχητικό ιστορικό, σαφή βιομηχανική βάση και χρονοδιάγραμμα χερσαίας εκτόξευσης που ξεπερνά τις περισσότερες εναλλακτικές, ο NCM-LCM Mk2 είναι η ισχυρότερη πρόταση της MBDA μέχρι σήμερα για τον τυποποιημένο ευρωπαϊκό πύραυλο κρουζ βαθέος πλήγματος.</p>"

  "fr": {

    "title": "La Réponse européenne au Tomahawk : MBDA Dévoile le Missile de Croisière LCM/NCM Mk2",
    "subtitle": "Présenté à Eurosatory 2026, le Mk2 — décliné en versions navale et terrestre — offre une frappe de précision à plus de 1 000 km avec un anti-brouillage de nouvelle génération, un guidage terminal infrarouge et un lanceur mobile à quatre cellules disponible dès 2029, comblant le vide laissé par l'échec de l'acquisition allemande du Tomahawk.",
    "body": "<p>À Eurosatory 2026, MBDA a dévoilé ce qui pourrait devenir l'arme de frappe dans la profondeur déterminante pour l'Europe dans la prochaine décennie : le Missile de Croisière Naval – Missile de Croisière Terrestre Mk2 (NCM-LCM Mk2). Pour la première fois, le missilier européen a présenté un système terrestre de lancement complet aux côtés du missile amélioré — un lanceur-érecteur à quatre conteneurs en échelle réelle, opérationnel en moins de quinze minutes depuis une position non préparée.</p>\n\n<h3>Filiation et logique</h3>\n<p>Le Mk2 descend du Missile de Croisière Naval (MdCN), qui équipe les frégates FREMM et les sous-marins nucléaires d'attaque classe Suffren de la Marine nationale depuis 2017. Le MdCN a acquis son statut « éprouvé au combat » en avril 2018 lorsque les frégates <em>Aquitaine</em>, <em>Provence</em> et <em>Languedoc</em> ont tiré trois munitions contre une installation d'armes chimiques syrienne dans une opération conjointe avec les États-Unis et le Royaume-Uni. La nouvelle variante conserve la cellule de 6,5 mètres — essentielle pour la compatibilité avec le lanceur vertical Sylver A70 et les tubes lance-torpilles de 533 mm — tout en améliorant pratiquement tout sous la peau.</p>\n\n<h3>Ce qui change dans le Mk2</h3>\n<p>La modification la plus visible est le remodelage du nez, optimisé pour une portée accrue et abritant un ensemble capteur substantiellement amélioré : un autodirecteur infrarouge pour le guidage terminal, des systèmes électro-optiques pour la navigation topographique, et un package hybride GNSS/INS qui maintient la précision du missile lorsque les signaux satellitaires sont brouillés, leurés ou refusés. Un dispositif anti-brouillage de nouvelle génération durcit davantage la chaîne de navigation. MBDA annonce une furtivité améliorée grâce à une section radar réduite et un profil de vol en suivi de terrain permettant au Mk2 de voler plus bas que son prédécesseur.</p>\n\n<p>La combinaison de guidage inertiel, à référence de terrain, électro-optique et infrarouge offre au missile de multiples voies redondantes vers une précision métrique en phase terminale — une couverture délibérée contre les environnements de guerre électronique qui caractérisent le conflit en Ukraine.</p>\n\n<h3>Le lanceur terrestre</h3>\n<p>La variante terrestre LCM associe le Mk2 à un Ground Launch System (GLS) dérivé du Sylver A70 naval, accueillant quatre conteneurs. MBDA envisage des batteries mobiles capables d'opérations « tire et bouge » depuis des positions dissimulées, offrant aux armées de terre un bras de frappe dans la profondeur indépendant de la puissance aérienne ou de la flotte. Le concept rappelle le système américain Typhon — à la différence que le LCM est un produit souverain européen exempt de licences d'exportation américaines.</p>\n\n<p>Le GLS est programmé pour être disponible dès 2029, avec une entrée en service du système complet visée autour de 2030. La Direction Générale de l'Armement (DGA) est en négociations avec MBDA pour un premier lot de production.</p>\n\n<h3>Combler le vide du Tomahawk</h3>\n<p>Le contexte géopolitique confère une urgence particulière au LCM Mk2. L'Allemagne poursuivait l'acquisition du Tomahawk pour doter ses forces terrestres d'une capacité de frappe à longue portée, mais cet accord s'est effondré. Le Danemark cherche également une solution de frappe profonde, bien qu'il puisse exiger une portée supérieure à l'enveloppe actuelle de 1 000+ km du Mk2. L'initiative ELSA à six nations — France, Allemagne, Italie, Pologne, Suède et Royaume-Uni — vise une arme future dépassant 2 000 km, mais ne devrait pas aboutir avant le milieu des années 2030. Le LCM Mk2 se positionne comme le pont : une option souveraine de lignée éprouvée au combat, disponible des années avant la maturation d'ELSA.</p>\n\n<h3>Le portefeuille élargi</h3>\n<p>À Eurosatory, MBDA a présenté le LCM Mk2 aux côtés de DELUGE, un effecteur à sens unique terrestre de 500 km conçu pour les attaques de saturation. L'approche en couches — missile de croisière de précision pour les cibles de haute valeur, munitions de masse pour la suppression — reflète une doctrine reconnaissant qu'aucune arme seule ne suffit face aux défenses multicouches d'un adversaire de pair. Les solutions concurrentes sur le marché européen de la frappe profonde incluent le système de lanceur X-Fire (Soframe–Thales–ArianeGroup) et le programme Thundart (Safran-MBDA).</p>\n\n<p>Fort d'un bilan de combat avéré, d'une base industrielle claire et d'un calendrier terrestre qui devance la plupart des alternatives, le NCM-LCM Mk2 représente la proposition la plus solide de MBDA pour devenir le missile de croisière de frappe profonde standard européen.</p>"
  },
  "da": {
    "lang_label": "DA",
    "cat": "Forsvar",
    "date": "3. juli 2026",
    "cities": "· Paris · London · Berlin",
    "title": "Europas Tomahawk-svar: MBDA Præsenterer LCM/NCM Mk2 Krydsermissilet til Dybdeangreb",
    "subtitle": "Præsenteret på Eurosatory 2026 leverer Mk2 — i land- og søversion — præcisionsangreb på over 1.000 km med næste generations anti-jamming, infrarød terminalstyring og en firecellers mobil affyringsrampe klar fra 2029, hvilket udfylder hullet efter sammenbruddet af Tysklands Tomahawk-indkøb.",
    "body": "<p>På Eurosatory 2026 i Paris afslørede MBDA det, der kan blive Europas afgørende dybdeangrebsvåben i det næste årti: Naval Cruise Missile – Land Cruise Missile Mk2 (NCM-LCM Mk2). For første gang præsenterede virksomheden et komplet landbaseret affyringssystem sammen med det opgraderede missil — en firecellers erector-launcher i fuld skala, operationelt klar fra en uforberedt position på under femten minutter.</p>\n\n<h3>Arv og rationale</h3>\n<p>Mk2 nedstammer fra Missile de Croisière Naval (MdCN), der har udstyret den franske flådes FREMM-fregatter og Suffren-klasse atomangrebsubåde siden 2017. MdCN opnåede sin kampbeviste status i april 2018, da fregatterne <em>Aquitaine</em>, <em>Provence</em> og <em>Languedoc</em> affyrede tre missiler mod et syrisk kemisk våben-anlæg i en fællesoperation med USA og Storbritannien. Den nye variant bevarer den 6,5 meter lange missilkrop — afgørende for kompatibilitet med Sylver A70 vertikalaffyringsenheden og 21-tommer ubåds-torpedorør — mens næsten alt inden i skroget er opgraderet.</p>\n\n<h3>Hvad ændrer sig i Mk2</h3>\n<p>Den mest synlige ændring er en omformet næsesektion, optimeret til større rækkevidde og med en væsentligt opgraderet sensorsuite: en infrarød søger til terminalstyring, elektro-optiske systemer til topografisk navigation og en hybrid GNSS/INS-pakke, der holder missilet præcist, selv når satellitsignaler bliver forstyrret, forfalsket eller nægtet. En næste generations anti-jamming-enhed hærder navigationskæden yderligere. MBDA hævder forbedret stealth gennem reduceret radartværsnit og en terrænfølgende flyveprofil, der lader Mk2 flyve lavere end forgængeren.</p>\n\n<p>Kombinationen af inertiel, terrænrelateret, elektro-optisk og infrarød styring giver missilet flere redundante veje til metrisk præcision i terminalfasen — en bevidst afdækning mod de elektroniske krigsførelsesmiljøer, der har præget krigen i Ukraine.</p>\n\n<h3>Landaffyringsrampen</h3>\n<p>Landversionen LCM parrer Mk2 med et Ground Launch System (GLS) baseret på det maritime Sylver A70 med fire beholdere. MBDA forestiller sig mobile batterier med evne til skyd-og-flyt-operationer fra skjulte positioner, hvilket giver hære en dybdeangrebsarm uafhængig af luftstyrker eller flåden. Konceptet afspejler det amerikanske Typhon-system — bortset fra at LCM er et suverænt europæisk produkt uden amerikanske eksportlicensbegrænsninger.</p>\n\n<p>GLS forventes tilgængelig fra 2029, med fuld indgang i tjeneste omkring 2030. Frankrigs DGA forhandler med MBDA om en første produktionsbatch.</p>\n\n<h3>Udfyldning af Tomahawk-hullet</h3>\n<p>Den geopolitiske kontekst giver LCM Mk2 særlig hastende relevans. Tyskland forfulgte en Tomahawk-anskaffelse til sine landstyrker, men den aftale er reelt brudt sammen. Danmark søger ligeledes en dybdeangrebsløsning, selvom behovet muligvis kræver rækkevidde ud over Mk2's nuværende 1.000+ km. Den seksnational ELSA-tilgang — Frankrig, Tyskland, Italien, Polen, Sverige og Storbritannien — sigter mod et fremtidigt våben over 2.000 km, men forventes ikke leveret før midt i 2030'erne. LCM Mk2 positionerer sig som broen: en suveræn mulighed med kampbevist arv, tilgængelig år før ELSA modnes.</p>\n\n<h3>Den bredere portefølje</h3>\n<p>På Eurosatory parrede MBDA LCM Mk2 med DELUGE, en billigere landbaseret engangseffekt med 500 km rækkevidde designet til mætningsangreb. Den lagdelte tilgang — præcisionskrydsermissil til mål af høj værdi, masseeffektammunition til undertrykkelse — afspejler en doktrin, der erkender, at intet enkelt våben er tilstrækkeligt mod en jævnbyrdig modstanders lagdelte forsvar.</p>\n\n<p>Med en bevist kampbilanz, en klar industriel base og en landbaseret tidsplan, der slår de fleste alternativer, er NCM-LCM Mk2 MBDAs hidtil stærkeste bud på at blive det europæiske standardkrydsermissil til dybdeangreb.</p>"
  },

    "body": "<p>På Eurosatory 2026 i Paris avtäckte MBDA det som kan bli Europas avgörande djupanfallsvapen för det kommande decenniet: Naval Cruise Missile – Land Cruise Missile Mk2 (NCM-LCM Mk2). För första gången visade företaget ett komplett markbaserat avfyrningssystem tillsammans med den uppgraderade roboten — en fyracellers erector-launcher i fullskala, operativ från en oförberedd position på under femton minuter.</p>\n\n<h3>Arv och logik</h3>\n<p>Mk2 härstammar från Missile de Croisière Naval (MdCN), som utrustat franska marinens FREMM-fregatter och Suffren-klass kärnvapenattackubåtar sedan 2017. MdCN fick sin stridstestad status i april 2018 när fregatterna <em>Aquitaine</em>, <em>Provence</em> och <em>Languedoc</em> avfyrade tre robotar mot en syrisk kemvapenanläggning i en gemensam operation med USA och Storbritannien. Den nya varianten behåller den 6,5 meter långa robotkroppen — avgörande för kompatibilitet med Sylver A70 vertikalavfyraren och 21-tums ubåtstorpedrör — men uppgraderar i princip allt under skalet.</p>\n\n<h3>Vad som ändras i Mk2</h3>\n<p>Den mest synliga förändringen är en omformad nosektion, optimerad för längre räckvidd och med en väsentligt uppgraderad sensorsuite: en infraröd sökare för terminalstyrning, elektro-optiska system för topografisk navigering, samt ett hybrid GNSS/INS-paket som håller roboten precis även när satellitsignaler störs, förfalskas eller nekas. En anti-jamming-enhet av nästa generation härdar navigeringskedjan ytterligare. MBDA hävdar förbättrad smygteknik genom minskad radartvärsnittsarea och en terrängföljande flygprofil som låter Mk2 flyga lägre än sin föregångare.</p>\n\n<p>Kombinationen av tröghet-, terrängbaserad, elektro-optisk och infraröd styrning ger roboten flera redundanta vägar till metrisk precision i terminalfasen — en medveten säkring mot de elektroniska krigföringsmiljöer som präglat kriget i Ukraina.</p>\n\n<h3>Markavfyraren</h3>\n<p>Landversionen LCM parar Mk2 med ett Ground Launch System (GLS) baserat på det marina Sylver A70 med fyra behållare. MBDA ser framför sig mobila batterier kapabla till skjut-och-flytta-operationer från dolda positioner, vilket ger arméer en djupanfallsarm oberoende av flyg eller flottan. Konceptet speglar det amerikanska Typhon-systemet — med skillnaden att LCM är en suverän europeisk produkt utan amerikanska exportlicensvillkor.</p>\n\n<p>GLS planeras vara tillgängligt från 2029, med full driftsättning runt 2030. Frankrikes DGA förhandlar med MBDA om en första produktionssats.</p>\n\n<h3>Fylla Tomahawk-gapet</h3>\n<p>Det geopolitiska sammanhanget ger LCM Mk2 särskild brådska. Tyskland strävade efter att anskaffa Tomahawk för markstridskrafter, men den affären har i praktiken kollapsat. Danmark söker likaså en djupanfallslösning, även om behovet kan kräva räckvidd utöver Mk2:s nuvarande 1 000+ km. Det sexnationella ELSA-initiativet — Frankrike, Tyskland, Italien, Polen, Sverige och Storbritannien — siktar på ett framtida vapen över 2 000 km, men förväntas inte leverera före mitten av 2030-talet. LCM Mk2 positionerar sig som bron: ett suveränt alternativ med stridstestad härstamning, tillgängligt år innan ELSA mognar.</p>\n\n<h3>Den bredare portföljen</h3>\n<p>På Eurosatory visade MBDA LCM Mk2 tillsammans med DELUGE, en billigare markbaserad engångseffektor med 500 km räckvidd designad för mättnadsanfall. Det skiktade angreppssättet — precisionskryssningsrobot för högvärdiga mål, masseffektammunition för undertryckning — avspeglar en doktrin som erkänner att inget enskilt vapen räcker mot en jämnbördig motståndares skiktade försvar.</p>\n\n<p>Med bevisad stridserfarenhet, en tydlig industriell bas och en markbaserad tidslinje som slår de flesta alternativ, är NCM-LCM Mk2 MBDA:s hittills starkaste bud på att bli den europeiska standardkryssningsroboten för djupanfall.</p>"
